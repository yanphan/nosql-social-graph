services:
  falkordb:
    image: falkordb/falkordb:latest
    container_name: falkordb
    ports:
      - "6379:6379"   # DB Port
      - "3000:3000"   # FalkorDB Browser
    environment:
      - REDIS_ARGS=--requirepass ${FALKORDB_PASSWORD:-falkor_dev_pass} --appendonly yes
    volumes:
      - falkordb_data:/var/lib/falkordb/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${FALKORDB_PASSWORD:-falkor_dev_pass}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: social_backend
    ports:
      - "4000:4000"
    environment:
      - PORT=4000
      - FALKORDB_HOST=falkordb
      - FALKORDB_PORT=6379
      - FALKORDB_PASSWORD=${FALKORDB_PASSWORD:-falkor_dev_pass}
      - FALKORDB_GRAPH=${FALKORDB_GRAPH:-social}
      - JWT_SECRET=${JWT_SECRET:-social_graph_secret_key_demo_2026}
      - CORS_ORIGIN=${CORS_ORIGIN:-http://localhost:5173,http://localhost:80,http://localhost}
    depends_on:
      falkordb:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=/api
        - VITE_USE_MOCK=false
        - VITE_BROWSER_URL=http://localhost:3000
    container_name: social_frontend
    ports:
      - "5173:80"
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: postgres_bench
    profiles: ["bench"]
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${PG_USER:-postgres}
      POSTGRES_PASSWORD: ${PG_PASSWORD:-postgres_bench_pass}
      POSTGRES_DB: ${PG_DATABASE:-social_bench}
    volumes:
      - pg_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  falkordb_data:
  pg_data:
